name: Publish

on:
  workflow_run:
    workflows:
      - Release packages
    types:
      - completed

concurrency:
  group: npm-release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: Production
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-packages
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Validate and publish release packages
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          node --experimental-strip-types scripts/release/publish.ts
          --registry=https://registry.npmjs.org --expected-sha=$BUILD_SHA
